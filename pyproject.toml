[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2ppt"
version = "0.1.0"
description = "Hybrid PDF to editable PPTX converter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.27.0",
  "python-pptx>=1.0.0",
  "paddleocr>=3.4.0",
  "chardet<6",
  "opencv-python-headless>=4.10.0",
  "Pillow>=10.0.0",
  "numpy>=1.26.0,<2.0",
  "fastapi>=0.115.0",
  "pydantic>=2.13.2,<2.14",
  "uvicorn>=0.32.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
gpu = [
  "onnxruntime-gpu>=1.18.0,<2.0",
]

[project.scripts]
pdf2ppt = "pdf2ppt.cli:main"
pdf2ppt-api = "pdf2ppt.api:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# --- Phase 2 static analysis gate -------------------------------------
# Both tools are now blocking in CI (see .github/workflows/ci.yml). The
# Phase 0 baseline (49 ruff findings, 29 mypy findings) has been cleared
# everywhere except the inpainting_* modules below, which are excluded
# on purpose -- see the note next to each exclusion.

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  "frontend",
  "tests/fixtures",
  "lama",
  "model",
  "output",
  "outputs",
  # --- Temporary Phase 2 exclusions -----------------------------------
  # A parallel Phase 1 session is splitting inpainting_engines.py into
  # src/pdf2ppt/inpainting/ (see docs/optimization-roadmap.md Phase 1).
  # Linting these now would conflict with that rework. Remove this
  # exclusion once Phase 1 lands and re-run `ruff check` to fold them
  # back into the blocking gate.
  "src/pdf2ppt/inpainting.py",
  "src/pdf2ppt/inpainting_engines.py",
  "src/pdf2ppt/inpainting_overlay.py",
  "src/pdf2ppt/inpainting_masks.py",
  # scripts/lama_patches/ are patch files applied verbatim onto a cloned
  # third-party LaMa repo by scripts/apply_lama_patches.sh; they are
  # tightly coupled to the subprocess LaMa worker Phase 1 removes.
  # Remove this exclusion together with the inpainting_* ones above.
  "scripts/lama_patches",
]

[tool.ruff.lint]
# Deliberately small, high-signal rule set for the report-only baseline:
# pyflakes (F), a slice of pycodestyle (E/W), import sorting (I), and
# pyupgrade (UP). Broader rule sets (bugbear, complexity, etc.) are a
# later decision once the team has agreed on scope.
select = ["E", "F", "W", "I", "UP"]
ignore = [
  "E501",  # line-length is handled by the formatter/line-length setting, not worth failing the report on
]

[tool.mypy]
python_version = "3.11"
exclude = ["frontend/", "tests/fixtures/", "lama/", "model/", "output/", "outputs/"]
# Third-party stubs (fitz, cv2, PIL, pptx, fastapi, ...) are not installed
# in CI; without this the run is 90%+ import-not-found noise instead of a
# useful signal.
ignore_missing_imports = true
# The existing 8,100-line codebase predates any type-checking; being strict
# here would just produce thousands of untyped-def warnings that drown out
# the handful of real bugs mypy already finds.
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false

# --- Temporary Phase 2 exclusion ------------------------------------------
# Same rationale as the ruff exclusion above: a parallel Phase 1 session is
# reworking these modules (splitting inpainting_engines.py into a package).
# `exclude` alone would not suppress errors here because mypy still follows
# imports into these files from modules that are type-checked; `ignore_errors`
# on the module itself is what actually silences them. Remove this override
# once Phase 1 lands and re-run `mypy` to fold these modules back into the
# blocking gate.
[[tool.mypy.overrides]]
module = [
  "pdf2ppt.inpainting",
  "pdf2ppt.inpainting_engines",
  "pdf2ppt.inpainting_overlay",
  "pdf2ppt.inpainting_masks",
]
ignore_errors = true
