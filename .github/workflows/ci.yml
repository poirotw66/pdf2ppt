name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run backend tests
        run: pytest -q

  lint:
    # Phase 0 (docs/optimization-roadmap.md): report-only static analysis.
    # Findings are collected as a signal ahead of the Phase 1
    # inpainting_engines.py rework but must never turn CI red -- every step
    # (and the job itself) is continue-on-error. Phase 2 promotes this to a
    # blocking gate once the codebase has had a chance to work through the
    # baseline.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff mypy

      - name: ruff check (report-only)
        continue-on-error: true
        run: ruff check .

      - name: mypy (report-only)
        continue-on-error: true
        run: mypy src/pdf2ppt scripts/bench_inpaint.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: CI=1 npm test -- --watch=false

      - name: Build frontend
        run: npm run build