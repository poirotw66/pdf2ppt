name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run backend tests
        run: pytest -q

  lint:
    # Phase 2 (docs/optimization-roadmap.md): blocking static analysis.
    # The Phase 0 baseline has been cleared except for the inpainting_*
    # modules, which are temporarily excluded in pyproject.toml while a
    # parallel Phase 1 session splits inpainting_engines.py into a package
    # -- see the exclusion comments there for the removal plan.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff mypy

      - name: ruff check
        run: ruff check .

      - name: mypy
        run: mypy src/pdf2ppt scripts/bench_inpaint.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: CI=1 npm test -- --watch=false

      - name: Build frontend
        run: npm run build