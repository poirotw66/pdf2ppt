name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # Unit tests mock OCR; paddlepaddle is heavy — install paddleocr for
          # import/patch surfaces, plus server + pytest. Full [ocr] (with the
          # paddlepaddle==3.2.0 pin) is exercised via Docker / local OCR runs.
          python -m pip install -e ".[server,lint]" "paddleocr>=3.4.0,<4.0" "pytest>=8.0,<9" httpx

      - name: Run backend tests
        run: pytest -q

  packaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist

      - name: Install wheel in clean venv and run CLI
        run: |
          python -m venv /tmp/pdf2ppt-wheel-venv
          /tmp/pdf2ppt-wheel-venv/bin/python -m pip install --upgrade pip
          WHEEL=$(ls dist/pdf2ppt-*.whl | head -1)
          /tmp/pdf2ppt-wheel-venv/bin/python -m pip install "$WHEEL"
          /tmp/pdf2ppt-wheel-venv/bin/pdf2ppt --help >/dev/null
          /tmp/pdf2ppt-wheel-venv/bin/python -m pdf2ppt --help >/dev/null
          /tmp/pdf2ppt-wheel-venv/bin/pdf2ppt \
            tests/fixtures/solid_background.pdf /tmp/wheel-smoke.pptx
          test -s /tmp/wheel-smoke.pptx
          # Schema package data must ship in the wheel.
          /tmp/pdf2ppt-wheel-venv/bin/python -c "from importlib.resources import files; p=files('pdf2ppt')/'schemas'/'slideir.schema.json'; print(p); assert p.is_file()"

      - name: Dockerfile lint (no Docker daemon required)
        run: python scripts/check_dockerfiles.py

  lint:
    # Phase 2 (docs/optimization-roadmap.md): blocking static analysis.
    # The Phase 0 baseline has been cleared except for the inpainting_*
    # modules, which are temporarily excluded in pyproject.toml while a
    # parallel Phase 1 session splits inpainting_engines.py into a package
    # -- see the exclusion comments there for the removal plan.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint,server]"

      - name: ruff check
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy src/pdf2ppt scripts/bench_inpaint.py scripts/bench_slide.py scripts/bench_layout_planner.py

  # Phase 0 / P0 slide-quality evaluator: report-only, never blocks merge.
  # Pure metric unit tests also run (and must pass) under the backend job;
  # LibreOffice cases skip there when soffice is absent.
  slide-quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LibreOffice and pinned CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-noto-cjk
          fc-list | grep -i "Noto Sans CJK" | head -5 || true

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server]" "paddleocr>=3.4.0,<4.0" "pytest>=8.0,<9"

      - name: Run slide-quality metric tests
        run: pytest -q tests/test_render_compare.py

      - name: Bench digital fixtures (OCR off, report-only)
        # Hybrid fixtures (gradient_*, photo_texture, large_mask) need a working
        # PaddleOCR/PaddlePaddle stack during conversion; keep CI light by
        # scoring digital-native fixtures only. Full corpus: scripts/bench_slide.py
        run: |
          python scripts/bench_slide.py \
            --ocr off \
            --fixture solid_background \
            --fixture dark_background_light_text \
            --fixture geometric_chart \
            --fixture table \
            --fixture vector_shapes \
            --fixture flowchart \
            --fixture merged_table \
            --json-out output/bench_slide_ci.json \
            --work-dir output/bench_slide_ci_work
          python -c "import json; print(json.dumps(json.load(open('output/bench_slide_ci.json'))['summary'], indent=2))"

      - name: Upload bench JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-slide-ci
          path: output/bench_slide_ci.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: CI=1 npm test -- --watch=false

      - name: Build frontend
        run: npm run build
